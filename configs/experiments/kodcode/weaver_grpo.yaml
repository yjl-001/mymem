# Continue a Weaver-SFT checkpoint with reward optimization. Supply the
# preceding checkpoint at launch time; it is intentionally machine-specific:
#   --set model.load_model_path=/data/memgen-runs/.../model
base_cfg_path: configs/latent_memory/kodcode.yaml

launcher:
  accelerate_config: configs/zero2.yaml

model:
  model_name: Qwen/Qwen2.5-1.5B-Instruct
  attn_implementation: flash_attention_2
  load_model_path: null
  max_prompt_aug_num: 1
  max_inference_aug_num: 5
  weaver:
    model_name: Qwen/Qwen2.5-1.5B-Instruct
    prompt_latents_len: 8
    inference_latents_len: 8
  trigger:
    model_name: Qwen/Qwen2.5-1.5B-Instruct
    active: false

dataset:
  mode: grpo

run:
  mode: train
  train_weaver: true
  train_weaver_method: grpo
  train_trigger: false
  weaver:
    grpo:
      num_train_epochs: 1
      per_device_train_batch_size: 8
      per_device_eval_batch_size: 8
      num_generations: 8
      gradient_accumulation_steps: 1
      learning_rate: 1.0e-5
