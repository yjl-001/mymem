# A committed, portable experiment specification.  Machine-specific paths
# (checkpoints, data caches, output root) are supplied via environment vars or
# --set overrides at launch time and must not be committed here.
base_cfg_path: configs/latent_memory/kodcode.yaml

launcher:
  accelerate_config: configs/zero2.yaml
  cuda_visible_devices: "0"
  num_processes: 1

model:
  model_name: Qwen/Qwen2.5-1.5B-Instruct
  attn_implementation: flash_attention_2
  load_model_path: null
  max_prompt_aug_num: 1
  max_inference_aug_num: 5
  weaver:
    model_name: Qwen/Qwen2.5-1.5B-Instruct
    prompt_latents_len: 8
    inference_latents_len: 8
  trigger:
    model_name: Qwen/Qwen2.5-1.5B-Instruct
    active: false

dataset:
  mode: sft

run:
  mode: train
  train_weaver: true
  train_weaver_method: sft
  train_trigger: false
  weaver:
    sft:
      num_train_epochs: 2
      per_device_train_batch_size: 1
      per_device_eval_batch_size: 1
      gradient_accumulation_steps: 1
      learning_rate: 1.0e-5
